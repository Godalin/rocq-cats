name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Read the locked compiler
        id: toolchain
        run: |
          compiler=$(grep '^ocaml-base-compiler[.]' tools/ci/toolchain.lock)
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ steps.toolchain.outputs.compiler }}
          opam-pin: false
          opam-repositories: |
            rocq-released: https://rocq-prover.org/opam/released
            default: https://opam.ocaml.org
          cache-prefix: toolchain-${{ hashFiles('tools/ci/toolchain.lock') }}
      - name: Install the locked toolchain
        run: xargs opam install --yes --jobs=2 < tools/ci/toolchain.lock
      - name: Install and test both packages
        run: opam install --yes --with-test --jobs=2 ./minks .
      - name: Verify the installed toolchain
        run: |
          sh tools/ci/toolchain.sh > "$RUNNER_TEMP/toolchain.actual"
          diff -u tools/ci/toolchain.lock "$RUNNER_TEMP/toolchain.actual"
      - name: Validate checkout and bilingual documentation
        run: |
          opam exec -- dune build -j 2 @all @runtest @install
          opam exec -- dune exec tools/docs/docs.exe -- build --strict
