name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "rocq/rocq-prover:9.0"
          - "rocq/rocq-prover:9.1"
          - "rocq/rocq-prover:9.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rocq
        uses: rocq-community/docker-coq-action@v1
        with:
          opam_file: "rocq-cats.opam"
          custom_image: ${{ matrix.image }}
          export: "OPAMWITHTEST"
          before_install: |
            opam pin remove --no-action --yes dune
          before_script: |
            rocq --version
            dune --version
          after_script: |
            startGroup "Validate checkout and bilingual documentation"
              # The checkout belongs to the runner, not the container user.
              sudo chown -R "$(id -u):$(id -g)" "$WORKDIR"
              dune build -j 2 @all @runtest @install
              dune exec tools/docs/docs.exe -- build --strict
            endGroup
        env:
          OPAMWITHTEST: "true"
      - name: Restore workspace ownership
        if: ${{ always() }}
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
