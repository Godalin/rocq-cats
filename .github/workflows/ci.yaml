name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rocq
        uses: rocq-community/docker-coq-action@v1
        with:
          opam_file: "rocq-cats.opam"
          custom_image: "rocq/rocq-prover:9.3"
          export: "OPAMWITHTEST"
          before_install: |
            # The image pins an older Stdlib; use the package dependency bound.
            # 镜像固定了旧 Stdlib；解除固定后按项目依赖下界解析。
            opam pin remove --no-action --yes dune rocq-stdlib
            # Resolve the independent Minks package from this checkout.
            # 从本次检出的源码解析独立 Minks 包。
            opam pin add --no-action --yes --kind=path rocq-minks "$WORKDIR/minks"
          before_script: |
            rocq --version
            dune --version
            opam list --installed --columns=name,version rocq-core rocq-stdlib
          after_script: |
            startGroup "Validate checkout and bilingual documentation"
              # The checkout belongs to the runner, not the container user.
              sudo chown -R "$(id -u):$(id -g)" "$WORKDIR"
              dune build -j 2 @all @runtest @install
              dune exec tools/docs/docs.exe -- build --strict
            endGroup
        env:
          OPAMWITHTEST: "true"
      - name: Restore workspace ownership
        if: ${{ always() }}
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
